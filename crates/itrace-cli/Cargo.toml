[package]
name = "itrace-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for Image Trace"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
rayon.workspace = true
itrace-core = { path = "../itrace-core" }
itrace-store = { path = "../itrace-store" }
image.workspace = true
mimalloc = "0.1"

[features]
akaze = ["itrace-core/akaze"]
# ONNX semantic backend (needs a libonnxruntime dylib at run time).
semantic-onnx = ["itrace-core/semantic-onnx"]
