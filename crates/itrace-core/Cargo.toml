[package]
name = "itrace-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Image Trace core engine: hashing, metrics, descriptors, grouping"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
rayon.workspace = true
blake3.workspace = true
lopdf.workspace = true
zip.workspace = true
flate2 = "1"
akaze = { version = "0.7", optional = true }
ort = { workspace = true, optional = true }

[features]
default = []
akaze = ["dep:akaze"]
# ONNX Runtime `SemanticEmbedder` backend (`OnnxSemanticEmbedder`).
# Opt-in: needs a libonnxruntime dylib at run time (ITRACE_ORT_DYLIB /
# ORT_DYLIB_PATH / default soname). CI builds stay on `default` and
# never see the dependency.
semantic-onnx = ["dep:ort"]


