name: rust

on:
  workflow_dispatch:
  push:
    paths-ignore: ["legacy/**"]
  pull_request:
    paths-ignore: ["legacy/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      # PostgresStore contract parity (tests/store_contract.rs). The
      # sqlite path runs regardless; the pg suite activates on
      # ITRACE_TEST_DATABASE_URL.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: itrace
          POSTGRES_PASSWORD: itrace
          POSTGRES_DB: itrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itrace -d itrace"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ITRACE_TEST_DATABASE_URL: postgres://itrace:itrace@localhost:5432/itrace
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow
      - name: build server + cli
        run: cargo build --release -p itrace-server -p itrace-cli
      - name: run server
        run: |
          DATA_DIR=/tmp/e2e-data PORT=8902 ./target/release/itrace-server &
          for i in $(seq 1 30); do
            curl -sf localhost:8902/v1/health && break || sleep 1
          done
      - name: e2e smoke (upload → precompute → rot-inv compare → slice)
        run: bash scripts/e2e.sh
