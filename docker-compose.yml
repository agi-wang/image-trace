# MinIO + Postgres 开发环境：对象存储管文件，元数据/特征可选 Postgres。
# 用法: docker compose up -d  →
#   S3 blobs:  ITRACE_STORAGE=s3 S3_ENDPOINT=http://localhost:9000 \
#              S3_ACCESS_KEY=minioadmin S3_SECRET_KEY=minioadmin itrace-server
#   PG meta:   ITRACE_STORE=postgres \
#              ITRACE_DATABASE_URL=postgres://itrace:itrace@localhost:5432/itrace \
#              itrace-server
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  init-bucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/itrace || true;
      mc anonymous set download local/itrace || true"
    restart: "no"

  # Phase-2 metadata backend. Schema is applied automatically on first
  # connect (`PostgresStore::connect` runs the DDL); connect string:
  #   postgres://itrace:itrace@localhost:5432/itrace
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: itrace
      POSTGRES_PASSWORD: itrace
      POSTGRES_DB: itrace
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itrace -d itrace"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minio-data:
  postgres-data:
